services:
  db:
    environment:
      POSTGRES_PASSWORD: ${DB_PASSWORD:?isi DB_PASSWORD di .env}
    ports: !reset []

  backend:
    environment:
      SECRET_KEY: ${JWT_SECRET:?isi JWT_SECRET di .env}
      JWT_SECRET_KEY: ${JWT_SECRET}
      DATABASE_URL: postgresql+psycopg2://postgres:${DB_PASSWORD}@db:5432/buku_tamu
      CORS_ALLOWED_ORIGINS: https://${DOMAIN:?isi DOMAIN di .env}
    ports: !reset []

  frontend:
    build:
      args:
        NEXT_PUBLIC_API_URL: https://${DOMAIN}/api/v1
    environment:
      NEXT_PUBLIC_API_URL: https://${DOMAIN}/api/v1
    ports: !reset []

  caddy:
    image: caddy:2
    container_name: buku_tamu_caddy
    restart: unless-stopped
    depends_on:
      - frontend
      - backend
    environment:
      DOMAIN: ${DOMAIN}
    ports:
      - "${HTTP_PORT:-80}:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config

volumes:
  caddy_data:
  caddy_config: